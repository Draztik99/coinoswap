name: CoinoSwap Daily Rates (Generate Only)
on:
  schedule:
    # Trigger runner prewarming 14, 9 and 4 minutes BEFORE each candidate.
    # Setup/fonts/dependencies finish before fresh quotes are collected.
    # Every cron trigger is at least 5 min from its neighbour (GitHub minimum).
    # UTC 09:16..12:26 covers all seven SAST slots 11:30..14:30.
    # Only ONE randomized daily slot is allowed to generate; no old media.
    # GitHub schedule remains best-effort: the collector must fail closed if late.
    - cron: "16,21,26,46,51,56 9-11 * * *"
    - cron: "16,21,26 12 * * *"
  workflow_dispatch:
    inputs:
      emergency:
        description: 'One-time fresh generation outside randomized slot (manual only)'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: coinoswap-daily-rates
  cancel-in-progress: false
jobs:
  prepare:
    outputs:
      asset_generated: ${{ steps.save.outputs.asset_generated }}
      asset_commit: ${{ steps.save.outputs.asset_commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select today's randomized publishing slot
        id: slot
        env:
          EMERGENCY_RATES: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency == true && 'true' || 'false' }}
        run: python daily-rates/should_prepare.py
      - name: Ensure official Lato fonts for rendering
        if: steps.slot.outputs.selected == 'true'
        run: |
          if [ -f /usr/share/fonts/truetype/lato/Lato-Black.ttf ] &&
             [ -f /usr/share/fonts/truetype/lato/Lato-Bold.ttf ]; then
            echo "Lato installed; no apt update required"
          else
            sudo apt-get update -qq
            sudo apt-get install -y fonts-lato
          fi
      - if: steps.slot.outputs.selected == 'true'
        run: pip install -r daily-rates/requirements.txt
      - name: Hold pre-warmed runner until strict fresh-price window (NO POST)
        # Manual emergency recovery uses a new 3-minute target and must not wait
        # for the randomized scheduled window; generator safety is unchanged.
        if: steps.slot.outputs.selected == 'true' && github.event_name == 'schedule'
        run: python daily-rates/wait_until_prepare.py
      - name: Generate validated assets — NEVER publish
        if: steps.slot.outputs.selected == 'true'
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          EMERGENCY_RATES: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency == true && 'true' || 'false' }}
        run: python daily-rates/prepare_rates.py
      - name: Save dated image and audit
        id: save
        if: steps.slot.outputs.selected == 'true'
        run: |
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          day=$(TZ=Africa/Johannesburg date +%F)
          git add "docs/daily-rates/$day.png" "docs/daily-rates/$day.json"
          if git diff --cached --quiet; then
            echo "::error::No fresh validated image and manifest were created" >&2
            exit 1
          fi
          git commit -m "Daily Rates verified $day"
          # Competing analytics commits may advance main while this runner warms.
          # Retry ONLY the Git history sync, NEVER quote collection or posting.
          # Force-pushes and conflicting asset changes are expressly prohibited.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Daily Rates Git history conflict; no image replaced" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "asset_generated=true" >> "$GITHUB_OUTPUT"
              echo "asset_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Validated image not saved after safe push retries; no Facebook post" >&2
          exit 1

  publish-facebook:
    # APPROVED 2026-11-24: one recurring direct Facebook photo daily,
    # only after a freshly generated, checksum-validated rate image.
    # Metricool is Instagram-only; never re-enable Facebook there.
    # Manual dispatch remains generator-only (no automatic FB publication).
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'schedule' && vars.COINOSWAP_FB_DAILY_PAUSED != 'true' && needs.prepare.outputs.asset_generated == 'true' && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: facebook-live
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.asset_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wait for the official SAST publication time (NO POST)
        run: |
          day=$(TZ=Africa/Johannesburg date +%F)
          python social-publisher/live/wait_for_rates_target.py --audit "docs/daily-rates/$day.json"
      - name: Publish verified Facebook photo exactly once (NO RETRIES)
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.asset_commit }}
          APPROVAL_PHRASE: "I_APPROVE_SINGLE_COINOSWAP_FB_POST"
          COINOSWAP_FB_PAGE_ACCESS_TOKEN: ${{ secrets.COINOSWAP_FB_PAGE_ACCESS_TOKEN }}
          COINOSWAP_FB_LIVE_ENABLED: "true"
          COINOSWAP_METRICOOL_FB_DISABLED: "confirmed"
        run: |
          python social-publisher/live/publish_cli.py --publish --commit-sha "$SOURCE_SHA" | tee "$RUNNER_TEMP/coinoswap_fb_verified_result.json"
      - name: Commit independently verified Facebook receipt (NO POST)
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.asset_commit }}
        run: |
          day=$(TZ=Africa/Johannesburg date +%F)
          python social-publisher/live/publication_receipt.py \
            --result-json "$RUNNER_TEMP/coinoswap_fb_verified_result.json" \
            --audit-json "docs/daily-rates/$day.json" \
            --source-commit "$SOURCE_SHA" \
            --github-run-id "$GITHUB_RUN_ID"
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          git add "docs/daily-rates/facebook-publications/$day.json"
          git commit -m "Record verified direct Facebook Daily Rates post $day"
          # After Meta has independently confirmed publication, retry ONLY
          # this Git receipt push if main advanced. Never rerun the Meta POST.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              git rebase origin/main
            fi
          done
          echo "Receipt push unsuccessful; Facebook may ALREADY be live. Do not retry publishing." >&2
          exit 1
