name: CoinoSwap Social Analytics — Read-Only Daily Collector
on:
  # One-time bootstrap on merge, never triggered by its own data commits.
  push:
    branches: [main]
    paths:
      - "social-publisher/insights/**"
      - ".github/workflows/coinoswap-social-analytics.yml"
  # 19:05 SAST = 17:05 UTC. Collect after every 11:30–14:30 post window.
  # GitHub schedule dispatch is best-effort. No social publishing calls.
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coinoswap-social-analytics-only
  cancel-in-progress: false
jobs:
  collect-facebook:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: facebook-live
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate read-only insights code (NO SOCIAL POST)
        run: |
          python -m compileall -q social-publisher/insights
          python -m unittest discover -s social-publisher/insights/tests -v
      - name: Import authenticated Metricool connector inbox (OFFLINE only)
        run: python social-publisher/insights/instagram_inbox.py
      - name: Collect aggregate Facebook post metrics by GET only
        env:
          COINOSWAP_FB_PAGE_ACCESS_TOKEN: ${{ secrets.COINOSWAP_FB_PAGE_ACCESS_TOKEN }}
        run: python social-publisher/insights/facebook_collector.py
      - name: Render black-and-gold dashboard from verified snapshots
        run: python social-publisher/insights/dashboard.py
      - name: Save dated snapshots and dashboard (NO SOCIAL POST)
        run: |
          git config user.name "CoinoSwap Analytics Bot"
          git config user.email "coinoswap-analytics@users.noreply.github.com"
          git add docs/social-analytics/
          if git diff --cached --quiet; then
            echo "No new analytics snapshots or dashboard changes"
            exit 0
          fi
          git commit -m "Collect read-only CoinoSwap social metrics"
          git push origin HEAD:main
