name: CoinoSwap Direct Social - Offline Safety Tests (NO POST)
on:
  push:
    branches:
      - feature/direct-social-publishing
    paths:
      - "social-publisher/**"
      - "docs/direct-social/**"
      - ".github/workflows/direct-social-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    if: github.ref == 'refs/heads/feature/direct-social-publishing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test-only media dependency
        run: pip install -r social-publisher/requirements-test.txt
      - name: Check isolated source syntax
        run: python -m compileall -q social-publisher
      - name: Run offline validation and idempotency tests
        run: python -m unittest discover -s social-publisher/tests -v
      - name: Generate no-data analytics dashboard preview
        run: python social-publisher/dashboard.py --output coinoswap-shadow-dashboard.html
      - name: Upload dashboard preview artifact (NO LIVE DATA)
        uses: actions/upload-artifact@v6
        with:
          name: CoinoSwap-Shadow-Dashboard-Preview
          path: coinoswap-shadow-dashboard.html
          retention-days: 14

  postgres-safety-tests:
    if: github.ref == 'refs/heads/feature/direct-social-publishing'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shadow_test
          POSTGRES_USER: shadow_test
          POSTGRES_PASSWORD: ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadow_test -d shadow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install temporary database client
        run: python -m pip install "psycopg[binary]>=3.2,<4.0"
      - name: Test real transactional idempotency (NO SOCIAL POST)
        env:
          COINOSWAP_TEST_PG_DSN: postgresql://shadow_test:ci_fixture_only@127.0.0.1:5432/shadow_test
        run: python -m unittest discover -s social-publisher/tests-postgres -v
