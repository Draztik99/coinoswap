name: CoinoSwap Direct Social - Offline Safety Tests (NO POST)
on:
  push:
    branches:
      - feature/direct-social-publishing
    paths:
      - "social-publisher/**"
      - ".github/workflows/direct-social-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    if: github.ref == 'refs/heads/feature/direct-social-publishing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only media dependency
        run: pip install -r social-publisher/requirements-test.txt
      - name: Check isolated source syntax
        run: python -m compileall -q social-publisher
      - name: Run offline validation and idempotency tests
        run: python -m unittest discover -s social-publisher/tests -v
      - name: Generate no-data analytics dashboard preview
        run: python social-publisher/dashboard.py --output coinoswap-shadow-dashboard.html
      - name: Upload dashboard preview artifact (NO LIVE DATA)
        uses: actions/upload-artifact@v4
        with:
          name: CoinoSwap-Shadow-Dashboard-Preview
          path: coinoswap-shadow-dashboard.html
          retention-days: 14
