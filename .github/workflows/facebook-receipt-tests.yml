name: CoinoSwap Facebook Receipts — Offline Safety Tests (NO POST)
on:
  push:
    branches:
      - main
      - fix/facebook-publish-receipts-and-handover
      - "fix/facebook-*"
    paths:
      - "social-publisher/live/**"
      - "docs/daily-rates/facebook-publications/**"
      - "docs/daily-rates/*.json"
      - ".github/workflows/facebook-manual-publish.yml"
      - ".github/workflows/facebook-fresh-daily-rates-manual.yml"
      - ".github/workflows/daily-rates.yml"
      - ".github/workflows/facebook-receipt-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-receipts:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/facebook-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile receipt and sender modules (NO POST)
        run: python -m compileall -q social-publisher/live
      - name: Test all mocked Facebook publication and receipt safety checks
        run: python -m unittest discover -s social-publisher/live/tests -v
      - name: Test randomized source generation guards
        run: python -m unittest discover -s daily-rates/tests -v
