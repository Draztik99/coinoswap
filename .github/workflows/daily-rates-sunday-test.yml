name: CoinoSwap Daily Rates — Approved Live Asset Generation (NO AUTO POST)
# User-approved Sunday publication asset; fetches fresh quotes, does not publish
on:
  push:
    paths:
      - ".github/workflows/daily-rates-sunday-test.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coinoswap-manual-rates-test
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install branded artwork fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-lato
      - name: Install dependencies
        run: pip install -r daily-rates/requirements.txt
      - name: Fetch LIVE quotes and render approved media, no social publishing
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python daily-rates/live_once.py
      - name: Save approved official image and validation audit
        run: |
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          git add docs/daily-rates/2026-11-22.png docs/daily-rates/2026-11-22.json
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "Live Daily Rates image validated for approved publication (not yet posted)"
          git push
