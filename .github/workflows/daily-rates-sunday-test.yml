name: CoinoSwap Daily Rates — One-Off Live Test (NO POST)
# Live final validation run requested 2026-11-22 14:03 SAST; no social publishing
on:
  push:
    paths:
      - ".github/workflows/daily-rates-sunday-test.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coinoswap-manual-rates-test
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install branded artwork fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-lato
      - name: Install dependencies
        run: pip install -r daily-rates/requirements.txt
      - name: Fetch LIVE quotes and render preview, never post
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python daily-rates/test_now.py
      - name: Save test preview and audit for review
        run: |
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          git add docs/daily-rates/tests/
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "Live Daily Rates preview (TEST ONLY; not published)"
          git push
