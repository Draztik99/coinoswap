name: CoinoSwap Facebook — Same-Day Fresh Recovery (MANUAL LIVE POST)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type I_APPROVE_FRESH_COINOSWAP_DAILY_RATES_POST to authorize ONE fresh Facebook recovery post"
        required: true
        type: string
      metricool_facebook_disabled:
        description: "I confirm Facebook publishing is disabled in Metricool"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: coinoswap-daily-rates
  cancel-in-progress: false
jobs:
  same-day-recovery:
    # Never invoked by schedule or repository push; preserve explicit approval.
    if: github.ref == 'refs/heads/main' && inputs.approval == 'I_APPROVE_FRESH_COINOSWAP_DAILY_RATES_POST' && inputs.metricool_facebook_disabled == true
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: facebook-live
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check existing daily source, reservation and receipt (NO POST)
        run: |
          set -euo pipefail
          day=$(TZ=Africa/Johannesburg date +%F)
          test -f "docs/daily-rates/$day.json"
          test -f "docs/daily-rates/$day.png"
          test ! -e "docs/daily-rates/recovery/$day.json"
          test ! -e "docs/daily-rates/recovery/$day.png"
          test ! -e "docs/daily-rates/facebook-publications/$day.json"
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import sys
          sys.path.insert(0,"daily-rates")
          from check_source import audit_source
          day=datetime.now(ZoneInfo("Africa/Johannesburg")).date().isoformat()
          print(audit_source(date_sast=day,directory=Path("docs/daily-rates")))
          PY
          if git ls-remote --exit-code --refs origin "refs/tags/coinoswap-facebook-daily-rates-$day" >/dev/null; then
            echo "::error::This Facebook publication date has already been reserved."
            exit 2
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to verify Facebook date reservation"
              exit 2
            fi
          fi
      - name: Ensure official Lato image fonts
        run: |
          if ! test -f /usr/share/fonts/truetype/lato/Lato-Black.ttf ||
             ! test -f /usr/share/fonts/truetype/lato/Lato-Bold.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-lato
          fi
      - name: Install official image requirements
        run: python -m pip install -r daily-rates/requirements.txt
      - name: Generate genuinely NEW fresh validated prices (NO POST)
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          EMERGENCY_RATES: "true"
          COINOSWAP_RATES_RECOVERY: "true"
        run: python daily-rates/prepare_rates.py
      - name: Verify separate same-day image and checksum (NO POST)
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import sys
          sys.path.insert(0,"daily-rates")
          from check_source import audit_source
          day=datetime.now(ZoneInfo("Africa/Johannesburg")).date().isoformat()
          print(audit_source(date_sast=day,directory=Path("docs/daily-rates/recovery")))
          PY
      - name: Commit ONLY new recovery image and audit to immutable source commit
        id: save
        run: |
          set -euo pipefail
          day=$(TZ=Africa/Johannesburg date +%F)
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          git add "docs/daily-rates/recovery/$day.json" "docs/daily-rates/recovery/$day.png"
          if git diff --cached --quiet; then
            echo "::error::No new validated fresh-price source"
            exit 2
          fi
          git commit -m "Fresh same-day Facebook rescue source $day (NO POST)"
          # If main advanced, fail closed. NEVER overwrite the prior image,
          # force push or retry Facebook publishing.
          git push origin HEAD:main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for fresh recovery target (NO POST)
        run: |
          day=$(TZ=Africa/Johannesburg date +%F)
          python social-publisher/live/wait_for_rates_target.py --recovery --audit "docs/daily-rates/recovery/$day.json"
      - name: Publish exactly once and independently verify Meta (NO RETRY)
        env:
          APPROVAL_PHRASE: "I_APPROVE_SINGLE_COINOSWAP_FB_POST"
          COINOSWAP_FB_PAGE_ACCESS_TOKEN: ${{ secrets.COINOSWAP_FB_PAGE_ACCESS_TOKEN }}
          COINOSWAP_FB_LIVE_ENABLED: "true"
          COINOSWAP_METRICOOL_FB_DISABLED: "confirmed"
          COINOSWAP_FB_RECOVERY_ENABLED: "true"
          SOURCE_SHA: ${{ steps.save.outputs.source_sha }}
        run: |
          set -o pipefail
          python social-publisher/live/publish_cli.py --publish --recovery --commit-sha "$SOURCE_SHA" | tee "$RUNNER_TEMP/coinoswap_fb_verified_result.json"
      - name: Store independently verified Facebook receipt (NO POST)
        env:
          SOURCE_SHA: ${{ steps.save.outputs.source_sha }}
        run: |
          set -euo pipefail
          day=$(TZ=Africa/Johannesburg date +%F)
          python social-publisher/live/publication_receipt.py --recovery \
            --result-json "$RUNNER_TEMP/coinoswap_fb_verified_result.json" \
            --audit-json "docs/daily-rates/recovery/$day.json" \
            --source-commit "$SOURCE_SHA" \
            --github-run-id "$GITHUB_RUN_ID"
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          git add "docs/daily-rates/facebook-publications/$day.json"
          git commit -m "Record verified same-day Facebook recovery post $day"
          # Meta was already invoked; retry ONLY the Git receipt push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
            fi
          done
          echo "::error::Facebook may ALREADY be live. Do not retry this workflow."
          exit 1
