name: CoinoSwap Facebook — Read-Only Token Health (NO POST)
on:
  # A safe, one-off diagnostic whenever THIS health probe is updated on main.
  # This uses only Meta GET and cannot publish or rotate credentials.
  push:
    branches: [main]
    paths:
      - "social-publisher/facebook_health.py"
      - ".github/workflows/facebook-readonly-health.yml"
  # Read-only token readiness check at 11:00 SAST, before all eligible
  # 11:30–14:30 daily publishing slots. GitHub cron is best-effort.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-meta-token:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: facebook-live
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify CoinoSwap Facebook Page identity — GET ONLY
        env:
          COINOSWAP_FB_PAGE_ACCESS_TOKEN: ${{ secrets.COINOSWAP_FB_PAGE_ACCESS_TOKEN }}
        run: python social-publisher/facebook_health.py --check
