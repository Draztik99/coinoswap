name: CoinoSwap Facebook — Fresh Daily Rates Rescue (MANUAL LIVE POST)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type I_APPROVE_FRESH_COINOSWAP_DAILY_RATES_POST to authorize one real Facebook photo post"
        required: true
        type: string
      metricool_facebook_disabled:
        description: "I confirm Metricool Facebook publishing is disabled for CoinoSwap Daily Rates (Instagram remains unchanged)"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: coinoswap-daily-rates
  cancel-in-progress: false
jobs:
  manual-rates:
    # Explicit approval AND acknowledgement of Metricool cutover.
    # No schedule and no push-triggered delivery.
    if: github.ref == 'refs/heads/main' && inputs.approval == 'I_APPROVE_FRESH_COINOSWAP_DAILY_RATES_POST' && inputs.metricool_facebook_disabled == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: facebook-live
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check current date has not been generated already
        id: selection
        env:
          EMERGENCY_RATES: "true"
        run: |
          python daily-rates/should_prepare.py
          day=$(TZ=Africa/Johannesburg date +%F)
          if test -f "docs/daily-rates/$day.json" || test -f "docs/daily-rates/$day.png"; then
            echo "Current-day asset already exists: no duplicate recovery."
            exit 2
          fi
      - name: Ensure official image fonts
        run: |
          if ! test -f /usr/share/fonts/truetype/lato/Lato-Black.ttf ||
             ! test -f /usr/share/fonts/truetype/lato/Lato-Bold.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-lato
          fi
      - name: Install existing official image dependencies
        run: python -m pip install -r daily-rates/requirements.txt
      - name: Generate genuine fresh BTC ETH XMR rates image (NO POST)
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          EMERGENCY_RATES: "true"
        run: python daily-rates/prepare_rates.py
      - name: Verify official image and audit before making public
        run: python daily-rates/check_source.py
      - name: Commit validated image and audit, pin immutable SHA
        run: |
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          day=$(TZ=Africa/Johannesburg date +%F)
          git add "docs/daily-rates/$day.json" "docs/daily-rates/$day.png"
          if git diff --cached --quiet; then
            echo "No fresh asset to commit — blocking Facebook publication"
            exit 2
          fi
          git commit -m "Daily Rates manually verified $day (Facebook first photo)"
          git push origin HEAD:main
      - name: Wait until the validated SAST target, never post stale prices
        run: |
          day=$(TZ=Africa/Johannesburg date +%F)
          python social-publisher/live/wait_for_rates_target.py --audit "docs/daily-rates/$day.json"
      - name: Publish exactly one approved Facebook photo and verify readback
        env:
          APPROVAL_PHRASE: "I_APPROVE_SINGLE_COINOSWAP_FB_POST"
          COINOSWAP_FB_PAGE_ACCESS_TOKEN: ${{ secrets.COINOSWAP_FB_PAGE_ACCESS_TOKEN }}
          COINOSWAP_FB_LIVE_ENABLED: ${{ inputs.approval == 'I_APPROVE_FRESH_COINOSWAP_DAILY_RATES_POST' && 'true' || 'false' }}
          COINOSWAP_METRICOOL_FB_DISABLED: ${{ inputs.metricool_facebook_disabled == true && 'confirmed' || 'false' }}
        run: |
          sha=$(git rev-parse HEAD)
          python social-publisher/live/publish_cli.py --publish --commit-sha "$sha" | tee "$RUNNER_TEMP/coinoswap_fb_verified_result.json"
      - name: Persist separately verified Facebook publication receipt (NO POST)
        run: |
          day=$(TZ=Africa/Johannesburg date +%F)
          sha=$(git rev-parse HEAD)
          python social-publisher/live/publication_receipt.py \
            --result-json "$RUNNER_TEMP/coinoswap_fb_verified_result.json" \
            --audit-json "docs/daily-rates/$day.json" \
            --source-commit "$sha" \
            --github-run-id "$GITHUB_RUN_ID"
          git config user.name "CoinoSwap Rates Bot"
          git config user.email "coinoswap-rates-bot@users.noreply.github.com"
          git add "docs/daily-rates/facebook-publications/$day.json"
          git commit -m "Record independently verified Facebook Daily Rates post $day"
          git push origin HEAD:main
